<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Relay Room product flow</title>
  <desc id="description">An explanatory diagram showing private AI work becoming a shared operation with approval gates and evidence.</desc>
  <rect width="1440" height="720" fill="#171817"/>
  <rect x="28" y="28" width="1384" height="664" rx="8" fill="#f7f7f3"/>
  <text x="72" y="86" fill="#676963" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PRODUCT FLOW / EXPLANATORY DIAGRAM</text>
  <text x="72" y="132" fill="#171817" font-family="Arial, sans-serif" font-size="34" font-weight="700">From private agent chat to shared operational control</text>
  <text x="72" y="162" fill="#73756f" font-family="Arial, sans-serif" font-size="17">One objective, visible authority, explicit approvals, and a durable record.</text>

  <rect x="72" y="212" width="350" height="330" rx="6" fill="#ffffff" stroke="#d5d6d0"/>
  <text x="98" y="248" fill="#9b352a" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">BEFORE</text>
  <text x="98" y="284" fill="#171817" font-family="Arial, sans-serif" font-size="23" font-weight="700">AI work is private</text>
  <line x1="98" y1="308" x2="396" y2="308" stroke="#e2e3de"/>
  <circle cx="116" cy="348" r="7" fill="#ff9e91"/>
  <text x="138" y="354" fill="#3f413d" font-family="Arial, sans-serif" font-size="15">Context lives in one chat</text>
  <circle cx="116" cy="394" r="7" fill="#ff9e91"/>
  <text x="138" y="400" fill="#3f413d" font-family="Arial, sans-serif" font-size="15">No visible decision owner</text>
  <circle cx="116" cy="440" r="7" fill="#ff9e91"/>
  <text x="138" y="446" fill="#3f413d" font-family="Arial, sans-serif" font-size="15">Actions hide inside messages</text>
  <circle cx="116" cy="486" r="7" fill="#ff9e91"/>
  <text x="138" y="492" fill="#3f413d" font-family="Arial, sans-serif" font-size="15">Approvals disappear after the fact</text>

