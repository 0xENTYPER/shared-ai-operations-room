  <text x="398" y="620" fill="#82520a" font-family="Arial, sans-serif" font-size="12" font-weight="700">APPROVAL LANE</text>
  <text x="398" y="642" fill="#6d6f69" font-family="Arial, sans-serif" font-size="13">Publish, send, spend, change, delete</text>
  <line x1="750" y1="608" x2="750" y2="644" stroke="#d0d6c8"/>
  <text x="778" y="620" fill="#4d3a71" font-family="Arial, sans-serif" font-size="12" font-weight="700">EVIDENCE LANE</text>
  <text x="778" y="642" fill="#6d6f69" font-family="Arial, sans-serif" font-size="13">Findings, decisions, owners, outcomes</text>
