<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Relay Room example workflows</title>
  <desc id="description">Four example operations: release readiness, support incident, API migration, and customer communication.</desc>
  <rect width="1440" height="760" fill="#f1f1ed"/>
  <text x="64" y="72" fill="#6d6f69" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">WHERE THE ROOM EARNS ITS KEEP</text>
  <text x="64" y="116" fill="#171817" font-family="Arial, sans-serif" font-size="34" font-weight="700">Four operations, one control model</text>

  <rect x="64" y="166" width="632" height="236" rx="7" fill="#ffffff" stroke="#d5d6d0"/>
  <rect x="88" y="190" width="48" height="48" rx="6" fill="#c8f16c"/>
  <text x="112" y="221" text-anchor="middle" fill="#171817" font-family="Arial, sans-serif" font-size="16" font-weight="700">01</text>
  <text x="154" y="207" fill="#6d6f69" font-family="Arial, sans-serif" font-size="11" font-weight="700">RELEASE READINESS</text>
  <text x="154" y="234" fill="#171817" font-family="Arial, sans-serif" font-size="20" font-weight="700">Can we launch without guessing?</text>
  <text x="88" y="276" fill="#74766f" font-family="Arial, sans-serif" font-size="14">Agent checks CI, API health, billing, and rollback evidence.</text>
  <line x1="88" y1="304" x2="672" y2="304" stroke="#e2e3de"/>
  <text x="88" y="334" fill="#456b1f" font-family="Arial, sans-serif" font-size="12" font-weight="700">AUTONOMOUS</text>
  <text x="194" y="334" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Read checks and summarize blockers</text>
  <text x="88" y="365" fill="#82520a" font-family="Arial, sans-serif" font-size="12" font-weight="700">APPROVAL</text>
  <text x="194" y="365" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Publish notes or trigger release</text>

  <rect x="744" y="166" width="632" height="236" rx="7" fill="#ffffff" stroke="#d5d6d0"/>
  <rect x="768" y="190" width="48" height="48" rx="6" fill="#89c7ff"/>
  <text x="792" y="221" text-anchor="middle" fill="#171817" font-family="Arial, sans-serif" font-size="16" font-weight="700">02</text>
  <text x="834" y="207" fill="#6d6f69" font-family="Arial, sans-serif" font-size="11" font-weight="700">SUPPORT INCIDENT</text>
  <text x="834" y="234" fill="#171817" font-family="Arial, sans-serif" font-size="20" font-weight="700">What changed, and who replies?</text>
  <text x="768" y="276" fill="#74766f" font-family="Arial, sans-serif" font-size="14">Agent groups reports, checks telemetry, and drafts one response.</text>
  <line x1="768" y1="304" x2="1352" y2="304" stroke="#e2e3de"/>
  <text x="768" y="334" fill="#456b1f" font-family="Arial, sans-serif" font-size="12" font-weight="700">AUTONOMOUS</text>
  <text x="874" y="334" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Investigate evidence and deduplicate</text>
  <text x="768" y="365" fill="#82520a" font-family="Arial, sans-serif" font-size="12" font-weight="700">APPROVAL</text>
  <text x="874" y="365" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Send customer communication</text>

  <rect x="64" y="450" width="632" height="236" rx="7" fill="#ffffff" stroke="#d5d6d0"/>
  <rect x="88" y="474" width="48" height="48" rx="6" fill="#ffe0ba"/>
  <text x="112" y="505" text-anchor="middle" fill="#171817" font-family="Arial, sans-serif" font-size="16" font-weight="700">03</text>
  <text x="154" y="491" fill="#6d6f69" font-family="Arial, sans-serif" font-size="11" font-weight="700">API MIGRATION</text>
  <text x="154" y="518" fill="#171817" font-family="Arial, sans-serif" font-size="20" font-weight="700">Where will this change break us?</text>
  <text x="88" y="560" fill="#74766f" font-family="Arial, sans-serif" font-size="14">Agent maps a changelog to affected files and proposes a patch.</text>
  <line x1="88" y1="588" x2="672" y2="588" stroke="#e2e3de"/>
  <text x="88" y="618" fill="#456b1f" font-family="Arial, sans-serif" font-size="12" font-weight="700">AUTONOMOUS</text>
  <text x="194" y="618" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Inspect docs, code, and test impact</text>
  <text x="88" y="649" fill="#82520a" font-family="Arial, sans-serif" font-size="12" font-weight="700">APPROVAL</text>
  <text x="194" y="649" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Open PR or merge a migration</text>

  <rect x="744" y="450" width="632" height="236" rx="7" fill="#ffffff" stroke="#d5d6d0"/>
  <rect x="768" y="474" width="48" height="48" rx="6" fill="#c4a3ff"/>
  <text x="792" y="505" text-anchor="middle" fill="#171817" font-family="Arial, sans-serif" font-size="16" font-weight="700">04</text>
  <text x="834" y="491" fill="#6d6f69" font-family="Arial, sans-serif" font-size="11" font-weight="700">CUSTOMER ESCALATION</text>
  <text x="834" y="518" fill="#171817" font-family="Arial, sans-serif" font-size="20" font-weight="700">What can we promise safely?</text>
  <text x="768" y="560" fill="#74766f" font-family="Arial, sans-serif" font-size="14">Agent assembles account context, policy, owner, and next step.</text>
  <line x1="768" y1="588" x2="1352" y2="588" stroke="#e2e3de"/>
  <text x="768" y="618" fill="#456b1f" font-family="Arial, sans-serif" font-size="12" font-weight="700">AUTONOMOUS</text>
  <text x="874" y="618" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Prepare timeline and options</text>
  <text x="768" y="649" fill="#82520a" font-family="Arial, sans-serif" font-size="12" font-weight="700">APPROVAL</text>
  <text x="874" y="649" fill="#3f413d" font-family="Arial, sans-serif" font-size="13">Commit credit, deadline, or response</text>
</svg>
